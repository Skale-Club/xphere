name: Meta CAPI Worker

# Manual / emergency trigger only. The Meta Conversions API outbox is drained by
# the app itself: GET /api/cron/meta-capi-worker (src/lib/meta/capi-worker.ts),
# scheduled every 5 minutes from skale-cron. Production data is a self-hosted
# Postgres reachable only from the app's network, so this workflow no longer
# talks to the database: it just calls the route.

on:
  workflow_dispatch:
    inputs:
      org_id:
        description: 'Process a single org (optional)'
        required: false
      test:
        description: 'Send with each org test_event_code (Events Manager -> Test Events)'
        type: boolean
        default: false
      dry_run:
        description: 'Dry run - log, do not POST to Meta'
        type: boolean
        default: false

concurrency:
  group: meta-capi-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drain:
    name: Drain CAPI outbox
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fire meta-capi-worker endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
          ORG_ID: ${{ inputs.org_id }}
          TEST: ${{ inputs.test }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          QUERY=""
          if [ -n "$ORG_ID" ]; then QUERY="${QUERY}&org=${ORG_ID}"; fi
          if [ "$TEST" = "true" ]; then QUERY="${QUERY}&test=1"; fi
          if [ "$DRY_RUN" = "true" ]; then QUERY="${QUERY}&dry_run=1"; fi
          STATUS=$(curl -s -o /tmp/body -w "%{http_code}" \
            --connect-timeout 15 --max-time 95 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL}/api/cron/meta-capi-worker?${QUERY#&}")
          echo "Status: $STATUS"
          echo "Body: $(cat /tmp/body)"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "OK"
          else
            echo "meta-capi-worker cron failed with status $STATUS" >&2
            exit 1
          fi
