name: Xpot Task Sync

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: xpot-task-sync
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Drain Xpot task outbox
        run: |
          STATUS=$(curl -s -o /tmp/body -w "%{http_code}" \
            --connect-timeout 15 --max-time 55 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/xpot-task-sync")
          cat /tmp/body
          test "$STATUS" -ge 200 -a "$STATUS" -lt 300
