name: Meta Custom Audience Sync

# Manual / emergency trigger only. The hourly reconciliation of tenant-owned
# audiences runs inside the app: GET /api/cron/meta-audience-sync
# (src/lib/meta/audience-job.ts), scheduled hourly from skale-cron. The route
# answers immediately and runs the work in after() behind a run lock; the counts
# land in the app log. This workflow only calls the route.

on:
  workflow_dispatch:
    inputs:
      org_id:
        description: 'Constrain the run to one organization (optional)'
        required: false
      audience_id:
        description: 'Constrain the run to one audience config (optional)'
        required: false
      dry_run:
        description: 'Compute the exact diff without Graph or ledger mutation'
        type: boolean
        default: false

concurrency:
  group: meta-audience-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Reconcile tenant audiences
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fire meta-audience-sync endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
          ORG_ID: ${{ inputs.org_id }}
          AUDIENCE_ID: ${{ inputs.audience_id }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          QUERY=""
          if [ -n "$ORG_ID" ]; then QUERY="${QUERY}&org=${ORG_ID}"; fi
          if [ -n "$AUDIENCE_ID" ]; then QUERY="${QUERY}&audience=${AUDIENCE_ID}"; fi
          if [ "$DRY_RUN" = "true" ]; then QUERY="${QUERY}&dry_run=1"; fi
          STATUS=$(curl -s -o /tmp/body -w "%{http_code}" \
            --connect-timeout 15 --max-time 60 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL}/api/cron/meta-audience-sync?${QUERY#&}")
          echo "Status: $STATUS"
          echo "Body: $(cat /tmp/body)"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "OK (the run continues in the app; see the app log for the counts)"
          else
            echo "meta-audience-sync cron failed with status $STATUS" >&2
            exit 1
          fi
