name: DB Cutover Branch Build

# Temporary: proves the production image builds and runs the tests this change
# touches, on GitHub instead of the local machine. Nothing is deployed.
# Delete this file before merging feat/db-cutover-code.

on:
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: db-cutover-branch-build
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Tests touched by the cutover code
        run: >-
          npx vitest run --reporter=default
          tests/db-exit.test.ts tests/auth/supabase-jwt-local.test.ts tests/auth/supabase-jwt.test.ts
          tests/auth/no-supabase-auth.test.ts tests/auth/session.test.ts tests/auth/members-actions.test.ts
          tests/notifications/insert.test.ts tests/logger.test.ts tests/ads-tick-route.test.ts
          tests/cron-auth-fail-closed.test.ts tests/gbp-sync.test.ts tests/obs-alerts.test.ts
          tests/outbound-reply-routing.test.ts tests/knowledge-base.test.ts tests/storage-retention.test.ts
          tests/process-import-port.test.ts tests/process-import-batch.test.ts
          tests/website-analyzer-scheduling.test.ts tests/website-analyzer-concurrency.test.ts
          tests/calendar-tick-route.test.ts

  baseline:
    # The same two files on main, to tell pre-existing failures from new ones.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Baseline on main
        run: npx vitest run --reporter=default tests/outbound-reply-routing.test.ts tests/calendar-tick-route.test.ts || true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build production image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          secrets: |
            sentry_auth_token=
