name: Agent Eval Harness

# Manual / emergency trigger only. The weekly (Monday 08:00 UTC) LLM-judge eval
# runs inside the app: GET /api/cron/eval-harness (src/lib/evals/run-eval.ts),
# scheduled from skale-cron. The route answers immediately and runs the suite in
# after() behind a run lock; the report (counts and scores) lands in the app log
# and a failed gate goes to Sentry. This workflow only calls the route.
#
# Gate thresholds (src/lib/evals/run-eval.ts, same as tests/evals/runner.test.ts):
#   Average score  >= 3.5 / 5
#   No case        <  2.0 / 5
# `npm run eval` (vitest) still works for local runs.

on:
  workflow_dispatch:
    inputs:
      eval_org_id:
        description: 'Org ID to run evals against (overrides EVAL_ORG_ID in the app)'
        required: false
      eval_agent_id:
        description: 'Agent ID to evaluate (overrides EVAL_AGENT_ID in the app)'
        required: false

concurrency:
  group: eval-harness
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  eval:
    name: Run eval suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fire eval-harness endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
          ORG_ID: ${{ inputs.eval_org_id }}
          AGENT_ID: ${{ inputs.eval_agent_id }}
        run: |
          QUERY=""
          if [ -n "$ORG_ID" ]; then QUERY="${QUERY}&org_id=${ORG_ID}"; fi
          if [ -n "$AGENT_ID" ]; then QUERY="${QUERY}&agent_id=${AGENT_ID}"; fi
          STATUS=$(curl -s -o /tmp/body -w "%{http_code}" \
            --connect-timeout 15 --max-time 60 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL}/api/cron/eval-harness?${QUERY#&}")
          echo "Status: $STATUS"
          echo "Body: $(cat /tmp/body)"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "OK (the run continues in the app; see the app log for the report)"
          else
            echo "eval-harness cron failed with status $STATUS" >&2
            exit 1
          fi
