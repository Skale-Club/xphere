name: Release Gate

# CI enforcement point for Xphere's deterministic critical test battery.
# scripts/test-battery.ts includes the original Phase 135 release-gate
# members plus Action Engine, Vapi, workflow, auth/crypto, public API, and
# representative business-rule contracts. Its manifest is protected by
# tests/test-battery.test.ts. The command also validates workflow YAML and
# blocks the PR/commit on any failure.
#
# The same blocking command also runs as the first job in build-deploy.yml.
# This standalone workflow keeps PR/dev feedback focused, while the deploy
# workflow's `needs: release-gate` guarantees that red tests cannot ship.
#
# `npm run build` remains in build-deploy.yml's Docker build rather than being
# duplicated here. Use `npm run test:battery:release` for the equivalent local
# battery plus production build.
#
# Full coverage notes -- what this gate covers, what it deliberately does
# not (the ~29-file live-database baseline, the 24 write action types still
# pending idempotency classification), and why -- live in
# docs/agents/release-gate.md. Read that before changing this file.

on:
  pull_request: {}
  push:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'supabase/seeds/workflows/**'
      - '.planning/workflows/examples/**'
      - 'scripts/test-battery.ts'
      - 'scripts/release-gate.ts'
      - 'scripts/validate-workflows.ts'
      - '.github/workflows/release-gate.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Critical test battery + workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deterministic critical tests and workflow validation
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run test:battery
