name: NFC agent rollout

# Ops workflow for the keyword-activated agents release
# (.planning/research/nfc-keychain-whatsapp-agent.md §12). Never runs on an
# ordinary push: it starts from the Actions tab (workflow_dispatch) or when
# .github/rollout/nfc-agent.step (or this file) changes on main — the step file's content is the
# step to run, so an integration that cannot dispatch workflows can still
# request one through a reviewed commit.
#
# Steps:
#   plan           scripts/apply-migrations.mjs (simulation) — lists pending migrations, writes nothing.
#   migrate        plan, then apply ONLY if the pending set is exactly
#                  {1302_agent_keyword_activation_and_human_takeover.sql} (or
#                  empty). Anything else pending — someone else's migration —
#                  stops the run for a human to look at.
#   agent-dry-run  scripts/setup-skaleclub-nfc-agent.ts --dry-run (shows the persona).
#   agent          the same script for real (idempotent). Needs migration 1302.
#   all            migrate, then agent.
#
# The migration runner records versions in supabase_migrations.schema_migrations
# exactly like `supabase db push` (CLAUDE.md → Database), so the two stay one
# history; each file is applied in a transaction together with its ledger row.
# Secrets reach the scripts only as env vars, never as command-line arguments.

on:
  workflow_dispatch:
    inputs:
      step:
        description: 'What to run'
        required: true
        default: plan
        type: choice
        options: [plan, migrate, agent-dry-run, agent, all]
  push:
    branches: [main]
    paths:
      - '.github/rollout/nfc-agent.step'
      - '.github/workflows/nfc-agent-rollout.yml'

concurrency:
  group: nfc-agent-rollout
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No dependency cache: this job holds database/service-role secrets, and a
      # cache restored from another run is an avenue for cache poisoning.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Rollout
        env:
          STEP_INPUT: ${{ inputs.step }}
          # SUPABASE_DB_URL when set, else DATABASE_URL (the one release-gate uses).
          MIGRATION_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL || secrets.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          EXPECTED='1302_agent_keyword_activation_and_human_takeover.sql'

          # Only a known step name is ever acted on.
          RAW="${STEP_INPUT:-$(tr -d '[:space:]' < .github/rollout/nfc-agent.step)}"
          case "$RAW" in
            plan) STEP=plan ;;
            migrate) STEP=migrate ;;
            agent-dry-run) STEP=agent-dry-run ;;
            agent) STEP=agent ;;
            all) STEP=all ;;
            *) echo "::error::Unknown step"; exit 1 ;;
          esac
          echo "Running step: $STEP"

          if [ "$STEP" = plan ] || [ "$STEP" = migrate ] || [ "$STEP" = all ]; then
            if [ -z "$MIGRATION_DATABASE_URL" ]; then echo "::error::Neither SUPABASE_DB_URL nor DATABASE_URL secret is set"; exit 1; fi
            node scripts/apply-migrations.mjs 2>&1 | tee plan.txt
            grep -oE '^  · [0-9]+_[A-Za-z0-9_]+\.sql' plan.txt | sed 's/^  · //' | sort -u > pending.txt || true
            echo "Pending migrations:"; cat pending.txt
            if grep -vxq "$EXPECTED" pending.txt; then
              echo "::error::Other migrations are pending besides 1302 — not applying anything automatically."
              exit 1
            fi
            if [ "$STEP" != plan ]; then
              if [ -s pending.txt ]; then
                node scripts/apply-migrations.mjs "--only=$EXPECTED" --apply
              else
                echo "Nothing pending — 1302 already applied."
              fi
            fi
          fi

          if [ "$STEP" = agent-dry-run ]; then
            npx tsx scripts/setup-skaleclub-nfc-agent.ts --dry-run
          elif [ "$STEP" = agent ] || [ "$STEP" = all ]; then
            npx tsx scripts/setup-skaleclub-nfc-agent.ts
          fi
