# Platform-default workflow — ships to every org with Telegram connected.
# When an opportunity is marked won, notify the configured Telegram chat(s).

name: Deal won — notify Telegram
description: |
  Platform-default. When an opportunity moves to a stage with is_won=true,
  sends a Telegram notification with the contact name, the value and the
  opportunity title.
trigger:
  type: event
  event: opportunity.won

nodes:
  - id: notify
    kind: send_telegram_notification
    integration: telegram
    # No currency symbol: this ships to every org, and hardcoding one bills
    # every tenant in somebody else's money. The value is rendered as stored.
    text: |
      🏆 <b>Deal won</b>
      👤 {{contact.name}}
      💰 {{opportunity.value}}
      📋 {{opportunity.title}}
    parse_mode: HTML

edges:
  - from: trigger
    to: notify
