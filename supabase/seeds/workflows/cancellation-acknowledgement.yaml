# Platform-default workflow — ships to every org.
# Acknowledges a booking cancellation via SMS immediately after the event fires.

name: Cancellation acknowledgement
description: |
  Platform-default. Sends the attendee an SMS confirming their booking was
  cancelled, as soon as the cancellation happens.
trigger:
  type: event
  event: meeting.cancelled

nodes:
  - id: cancel_sms
    kind: send_sms
    integration: twilio
    to: "{{meeting.attendee_contact.phone}}"
    body: "Hi {{meeting.attendee_contact.name}}, your {{meeting.event_type.name}} booking has been cancelled. To book another time: {{meeting.event_type.booking_url}}"

edges:
  - from: trigger
    to: cancel_sms
