# Platform-default workflow — ships to every org.
# 1 hour after a meeting is marked complete, sends a review request via SMS.

name: Post-meeting review request
description: |
  Platform-default. An hour after a meeting is completed, sends the attendee an
  SMS asking for a quick review.
trigger:
  type: event
  event: meeting.completed

nodes:
  - id: wait
    kind: wait
    duration: "1h"

  - id: review_sms
    kind: send_sms
    integration: twilio
    to: "{{meeting.attendee_contact.phone}}"
    body: "Hi {{meeting.attendee_contact.name}}, thanks for meeting with us! Would you mind leaving a quick review? It really helps."

edges:
  - from: trigger
    to: wait
  - from: wait
    to: review_sms
