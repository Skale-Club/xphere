# Platform-default workflow — example: when an opportunity moves between
# stages, append an audit note to its activity feed. Useful as a starter
# template that orgs can copy and customize.

name: Stage changed — log a note
description: |
  Platform-default. When an opportunity moves to a different stage (other than
  won or lost), appends a note to its history recording the new stage.
trigger:
  type: event
  event: opportunity.stage_changed

nodes:
  - id: log_change
    kind: pipeline_add_note
    opportunity_id: "{{opportunity.id}}"
    content: "Stage changed to {{stage.to.name}} (automation)."

edges:
  - from: trigger
    to: log_change
