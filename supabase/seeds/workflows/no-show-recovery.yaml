# Platform-default workflow — ships to every org.
# After a no-show, waits 1 hour then sends an SMS with a reschedule link.

name: No-show recovery
description: |
  Platform-default. When a booking is marked as a no-show, waits an hour and
  sends the attendee an SMS with a link to rebook.
trigger:
  type: event
  event: meeting.no_show

nodes:
  - id: wait
    kind: wait
    duration: "1h"

  - id: recovery_sms
    kind: send_sms
    integration: twilio
    to: "{{meeting.attendee_contact.phone}}"
    body: "Hi {{meeting.attendee_contact.name}}, we missed you! Would you like to pick another time? You can book here: {{meeting.event_type.booking_url}}"

edges:
  - from: trigger
    to: wait
  - from: wait
    to: recovery_sms
