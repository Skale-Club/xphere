# Platform-default workflow — ships to every org.
# Sends an SMS reminder 24 hours before any confirmed meeting.
# Triggers via SEED-027 tick scheduler matching meeting.starts_in with offset -24h.

name: Pre-meeting reminder — 24 hours
description: |
  Platform-default. Sends the attendee an SMS reminder 24 hours before a
  confirmed meeting starts.
trigger:
  type: event
  event: meeting.starts_in
  config:
    offset: "-24h"

nodes:
  - id: notify
    kind: send_sms
    integration: twilio
    to: "{{meeting.attendee_contact.phone}}"
    body: "Hi {{meeting.attendee_contact.name}}, a reminder that you have a booking tomorrow: {{meeting.event_type.name}} at {{meeting.starts_at}}. Details: {{meeting.link}}"

edges:
  - from: trigger
    to: notify
