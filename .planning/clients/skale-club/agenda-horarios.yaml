# Skale Club — "quando dá para conversar?"
#
# Tool the booking specialist calls to see what is open. Read-only: it never
# holds a slot, so two callers asking at the same time both hear the truth and
# whoever books first gets it.
#
# Import with:
#   npx tsx --env-file=.env.local scripts/import-org-workflow.ts <org-id> \
#     .planning/clients/skale-club/agenda-horarios.yaml --apply

name: Agenda — horários livres
description: |
  Diz quais horários estão livres para a Conversa inicial num dia. Lê a agenda
  do Xphere — a mesma que a página pública mostra —, então o que já está
  marcado não aparece.
trigger:
  type: tool_call
  config:
    tool_name: check_meeting_times
    input_schema:
      date:
        type: string
        description: "The day to check, as YYYY-MM-DD in the host's timezone. Resolve 'next Tuesday' to a full date first."
        required: true

nodes:
  - id: slots
    kind: calendar_list_slots
    event_type: conversa-inicial
    date: "{{input.date}}"
    limit: 4
    # What the assistant says if the lookup fails. Without it the tool
    # answers with an empty string and the robot goes silent on the call.
    #
    # Both languages, because the receptionist is bilingual and a caller who
    # has been speaking English all call should not suddenly be answered in
    # Portuguese at the one moment something went wrong. The instruction tells
    # the assistant which half to say; it never reads both out loud.
    fallback_message: >-
      Say this in the language the caller has been using, and nothing else.
      PT: "Não consegui ver a agenda agora. Vou anotar e alguém do time confirma o horário com você."
      EN: "I can't see the calendar right now. I'll make a note and someone from the team will confirm a time with you."

edges:
  - from: trigger
    to: slots
